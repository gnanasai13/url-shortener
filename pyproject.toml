[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener API built with FastAPI, SQLAlchemy, MySQL, Redis, and Celery."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncmy>=0.2.9",
    "bcrypt>=4.2.0",
    "celery>=5.4.0",
    "cryptography>=43.0.1",
    "fastapi>=0.115.0",
    "PyJWT>=2.9.0",
    "pydantic[email]>=2.8.2",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.8",
    "sqlalchemy[asyncio]>=2.0.32",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20.0",
    "httpx>=0.27.2",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.3",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.setuptools.packages.find]
include = ["app*"]
